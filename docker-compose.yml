services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nba_savant
      POSTGRES_PASSWORD: nba_savant
      POSTGRES_DB: nba_savant
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nba_savant']
      interval: 5s
      retries: 10

  web:
    build: .
    depends_on:
      db: {condition: service_healthy}
    environment:
      DATABASE_URL: postgresql://nba_savant:nba_savant@db:5432/nba_savant?schema=public
      DIRECT_URL: postgresql://nba_savant:nba_savant@db:5432/nba_savant?schema=public
      RATE_LIMIT_PER_MINUTE: 120
    ports: ['3000:3000']

volumes:
  pgdata:
